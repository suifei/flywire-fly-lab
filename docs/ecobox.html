  <h1>数字果蝇生态箱</h1>
  <p>无人值守。你不给果蝇下任务——你只设计这个箱子的规则，然后看它在生存压力下自己学、自己进化。<b>连接组是固定的身体，可塑性层是后天学习</b>，奖励只来自它自己的身体：吃到东西，饿得轻一点。你改不了奖励，只能改世界。<a href="game.html">← 回数字果蝇实验室</a></p>
</header>

    </div>
    <div class="bar">
      <span class="small">点一下箱子：</span>
      <span class="seg" id="toolSeg"><button data-tool="pick">选一只</button><button data-tool="food">放食物</button><button data-tool="water">放水</button><button data-tool="beetle">放甲虫</button></span>

  </section>
  <section class="card">
    <div class="tabs" id="tabs"></div>
    <div class="pane" id="p-rules"></div>
    <div class="pane" id="p-fly"></div>
    <div class="pane" id="p-log"></div>
    <div class="pane" id="p-cards"></div>
    <div class="pane" id="p-replay"></div>
    <div class="pane" id="p-compare"></div>
    <div class="pane" id="p-save"></div>
  </section>
</main>
<section class="explain" id="explain"></section>
<footer>大脑用的是 FlyWire v783 连接组裁出的 15,055 个神经元的脉冲网络（子回路 v5）；页面里跑的是它的「响应面」——用真脑采样拟合出来的蒸馏，精度见上面的实测卡。世界、身体常数、可塑性层都是手写的，逐项登记在仓库的 docs/ecobox/ 里。</footer>
<div id="toast"></div>

    if (m3.worlds) cards.push(`<div class="card"><h2>M3 跨代进化：飞行倾向往哪走</h2><p class="small">32 只 · ${m3.seconds} s 箱内时间 · 每个世界 ${m3.n_seeds} 个种子。飞行是<b>可决策</b>的技能：起不起飞它说了算，怎么飞是固定弹道。</p><div class="tablewrap"><table><tr><th>世界</th><th>Δ 飞行倾向（各种子）</th><th>标签</th><th>寿命 前→后</th><th>先天喝水</th></tr>${m3.worlds.map(w => `<tr><td>${esc(w.name)}</td><td>${w.deltas.join("，")}</td><td>${w.label}</td><td>${w.life_head} → ${w.life_tail} s</td><td>${w.drink}</td></tr>`).join("")}</table></div><p class="small">判据（至少两个世界标签不同）：${yes(m3.pass)}</p></div>`);
    if (l2 && l2.arms.live) { const A = l2.arms, row = (n, a) => a ? `<tr><td>${n}</td><td>${a.mn9_on_water}</td><td>${a.mn9_sd_on_water}</td><td>${(100 * a.frac_mn9_below_5).toFixed(1)}%</td><td>${a.p_ingest_given_can}</td><td>${a.mean_visit_s} s</td><td>${a.drink_s} s</td></tr>` : "";
      cards.push(`<div class="card"><h2>那 4 倍是哪来的</h2><p class="small">真脑闭环里喝水时间曾是响应面的 4 倍，可「只尝到水」时的 MN9 两者只差 3%。把喝水时间拆成「每次碰到水停多久 × 在水上时决定喝的概率」，逐次决策记下来（400 s × 3 个种子，取中位）：</p><div class="tablewrap"><table><tr><th>臂</th><th>水上 MN9</th><th>逐步标准差</th><th>跌破 5 Hz 门槛</th><th>决定喝的概率</th><th>每次停留</th><th>喝水</th></tr>${row("响应面 · 第一版噪声（每步独立抽 0.3 s 窗的泊松）", A.surface)}${row("响应面 · 去噪声", A.surface_mean)}${row("响应面 · 加真脑同样的平滑", A.surface_ema)}${row("真脑", A.live)}${row("响应面 · 现在（按真脑量的单元数与 Fano 因子，再平滑）", A.surface_v4)}</table></div><p class="small">决策概率和均值都一样，差在停留时间：每一步只要没决定喝，果蝇就走 0.1 s（1.8 mm），水洼半径约 10 mm。第一版噪声逐步标准差是真脑的 2.5 倍，MN9 每 10 步跌破一次进食门槛就被迫走一步，所以待不住。真脑的读出是一组神经元的平均、按 0.3 s 平滑，而且真实神经元比泊松更规则（Fano：MN9 ${l2.fano ? l2.fano.mn9 : "?"}、巨纤维 ${l2.fano ? l2.fano.gf : "?"}）。现在响应面按真脑量出来的单元数与 Fano 因子加噪声、再同样平滑，逐步标准差与真脑一致。</p></div>`); }
    if (tr) cards.push(`<div class="card"><h2>搬进 3D 大自然：${tr.pass ? "迁移有效" : "迁移未通过"}</h2><p class="small">生态箱学成的个体（权重冻结）放进数字果蝇实验室的 3D 大自然——真的 15,055 神经元脉冲网络 + 有重力、天气、甲虫的世界；同一个世界种子下对比白纸。${tr.n_informative} 个种子有信息（至少一个臂碰到过水）。</p><div class="tablewrap"><table><tr><th>种子</th><th>白纸：喝 / 碰水 / 平均口渴 / 活</th><th>学成：喝 / 碰水 / 平均口渴 / 活</th></tr>${tr.runs.map(r => `<tr><td>${r.seed}${r.informative ? "" : "（没碰到水）"}</td><td>${r.naive.drink_s} s / ${r.naive.waterVisits} / ${r.naive.thirst_mean} / ${r.naive.life_s} s</td><td>${r.trained.drink_s} s / ${r.trained.waterVisits} / ${r.trained.thirst_mean} / ${r.trained.life_s} s</td></tr>`).join("")}</table></div><p class="small">X1 喝得更久（${tr.X1.more_drink_time}）且每次碰到水喝得更多（${tr.X1.drinks_per_visit_trained} 对 ${tr.X1.drinks_per_visit_naive}）：${yes(tr.X1.pass)}　X2 更不渴（${tr.X2.lower_mean_thirst}）：${yes(tr.X2.pass)}${tr.conclusive ? "" : "　有信息的种子不足 3 个：没有结论"}</p><p class="small">实验室页「生活」里的大自然有「载入生态箱存档」：把这里存下来的果蝇放进去。</p></div>`);
    if (m4.checks) cards.push(`<div class="card"><h2>M4 存档验收</h2><div class="chips">${m4.checks.map(c => `<span class="chip">${esc(c.name)} ${c.pass ? "✓" : "✗"}</span>`).join("")}</div><p class="small">中断 → 存成 JSON → 读回 → 接着跑，与不中断的那一份状态指纹相同（${esc(m4.fingerprint || "")}）。</p></div>`);
    $("#explain").innerHTML = cards.join(""); }

  // ———————————————————— 启动 ————————————————————
  buildTabs(); const q = new URLSearchParams(location.search); let resumed = false;
  if (!q.has("fresh")) { const raw = store.get(SAVE_KEY); if (raw) { try { resume(JSON.parse(raw)); resumed = true; setTimeout(() => toast("接着上次的箱子跑（想重来点「开新箱子」）"), 300); } catch (e) { store.del(SAVE_KEY); } } }
  if (!resumed) start(q.get("mode") === "evo" ? "evo" : "solo", {}, q.has("seed") ? +q.get("seed") : 0); if (q.has("speed")) { speed = +q.get("speed"); syncSeg(); }
  explain(); window.__eco = { get E() { return E; }, Save, start, resume, get log() { return log; } }; requestAnimationFrame(frame);
})();
</script>
