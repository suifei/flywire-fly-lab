name: CI

# 目的：不要再把会崩的游戏页推上线。
# 2026-09-16 有三处 `a``b` 漏写 `+`，被 JS 当成标签模板调用，线上直接报
# "… is not a function"——而 `node --check` 全程通过，因为那种写法语法合法。
# 所以这里跑的是**真的执行一遍**，不是只做语法检查。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    name: 游戏页冒烟测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 语法检查（brain.js / game_core.js）
        run: |
          node --check dodge/brain.js
          node --check dodge/game_core.js

      - name: 冒烟测试（用真实数据执行渲染路径）
        run: node dodge/smoke_test.js

      - name: 视觉链路 parity（JS 必须和 Python 逐值对上）
        run: |
          node vision/flyvis_parity.js
          node vision/retina_parity.js
          node vision/eye_e2e.js

      - name: Python 语法检查
        run: |
          python3 -m py_compile run_experiment.py connectome_vision_loop.py \
            dodge/build.py dodge/measure_neurons_fullbrain.py \
            dodge/subcircuit_vs_fullbrain_knockouts.py dodge/landing_pose_check.py \
            vision/frontend_check.py

      - name: 构建页面并确认与 docs/ 一致
        run: |
          python3 dodge/build.py
          # build.py 自带 lint，模板有问题会在这里中止
          if ! cmp -s results/dodge/fly_dodge.html docs/game.html; then
            echo "::error::docs/game.html 与构建产物不一致——改完模板后请重新执行："
            echo "::error::  python3 dodge/build.py && cp results/dodge/fly_dodge.html docs/game.html"
            exit 1
          fi

      - name: 安装浏览器测试依赖
        run: npm install --no-audit --no-fund

      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable

      - name: 真浏览器里跑一遍「让果蝇看你的图」
        # smoke_test 只能跑不依赖 DOM 的分支；复眼这块要 canvas / getImageData。
        # 这个项目吃过亏：node --check 全过，线上白屏。
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node dodge/browser_test.js

      - name: 复眼视野的几何自检（在已知方位放标记，核对它出现在哪）
        # 只验"画布有内容"是不够的：鱼眼映射、光轴符号、方向表里任何一处搞反，
        # 画面照样有内容，只是看到的世界是错的。2026-09-18 这个自检一次揪出 7 个错。
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node dodge/eyecam_geom_test.js
